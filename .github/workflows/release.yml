# Tag-based release workflow (Mono + IL2CPP via O5Dev reference assemblies).
#
# Usage: GitHub repo > Releases > Draft a new release
#   1. Choose or create a tag (numeric X.Y.Z, e.g. 5.9.3; suffixes like 5.9.3-beta.1 allowed)
#   2. Check "Set as a pre-release" for beta, leave unchecked for stable
#   3. Write release notes from tool/release_template.md, then Publish -> this workflow builds and attaches the files automatically
#
# Steps:
#   1. Validate the tag and check that the code version matches it
#   2. Check out O5Kit (sibling ProjectReference, not a submodule) + stage
#      the checked-in O5Dev reference DLLs (tool/build-refs/{mono,il2cpp}/)
#   3. Build Release_ML (Mono) and Release_ML_IL2CPP (IL2CPP)
#   4. Assemble Overlayer_ML_{win,linux,mac}.zip and Overlayer_ML_IL2CPP_{win,linux,mac}.zip
#   5. Upload all 6 zips to the published release (prerelease flag from the release is preserved)
#
# Before tagging (locally):
#   ./tool/set_version.sh 5.9.3   # inject version into Info.cs + csproj
#   ../O5Dev/o5dev refs           # refresh tool/build-refs/ if csproj refs changed
#   git add Overlayer/Core/Info.cs Overlayer/Overlayer.csproj
#   git commit -m "5.9.3" && git push
#   # then Draft a new release on GitHub with tag 5.9.3 and publish it
#
# NOTE: keep the code version numeric (X.Y.Z). A tag suffix like "-beta.1" is fine for
#   naming, but only the numeric part is injected into the build: OverlayerRuntime parses
#   Info.Version with new Version(), which throws on suffixes and would crash in-game.
#   Beta vs stable is distinguished via the release prerelease flag instead.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate tag and code version
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like X.Y.Z with an optional suffix (e.g. 5.9.3 or 5.9.3-beta.1). Got: $TAG"
            exit 1
          fi
          NUM="$(echo "$TAG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          CODE_VER="$(grep -oP '(?<=public const string Version = ")[^"]+' Overlayer/Core/Info.cs)"
          if [[ "$NUM" != "$CODE_VER" ]]; then
            echo "::error::code version ($CODE_VER) does not match tag ($TAG). Run tool/set_version.sh $NUM, commit it, move the tag, and re-publish."
            exit 1
          fi
          echo "tag=$TAG code_version=$CODE_VER"

      - name: Checkout O5Kit
        # Sibling ProjectReference (Overlayer.csproj -> ../../O5Kit/...),
        # not a submodule: it must sit next to this checkout, with its own
        # LitMotion submodule initialized. The checkout action only allows
        # paths inside the workspace, so land inside and move it out.
        uses: actions/checkout@v4
        with:
          repository: modlist-org/O5Kit
          path: O5Kit-tmp
          fetch-depth: 1
          submodules: recursive

      - name: Move O5Kit next to checkout
        run: |
          rm -rf ../O5Kit
          mv O5Kit-tmp ../O5Kit
          ls ../O5Kit/src/O5Kit/O5Kit.csproj ../O5Kit/lib/LitMotion/src/LitMotion/Assets/LitMotion/Runtime/LMotion.Create.cs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore O5Dev reference DLLs (Mono + IL2CPP)
        run: |
          # tool/build-refs/{mono,il2cpp}/ holds stripped reference assemblies
          # harvested from O5Dev by tool/pack_refs.sh (or `o5dev refs`): real
          # API surface with every method body replaced by `ret` / `throw null`
          # and resources dropped. build-refs.sha256 pins the O5Dev DLLs they
          # were generated from.
          dotnet run --project tool/GenRefs/GenRefs.csproj -- \
            verify tool/build-refs/build-refs.txt tool/build-refs
          rm -rf /tmp/o5dev-refs
          mkdir -p /tmp/o5dev-refs
          cp -r tool/build-refs/mono /tmp/o5dev-refs/mono
          cp -r tool/build-refs/il2cpp /tmp/o5dev-refs/il2cpp
          ls -R /tmp/o5dev-refs | head -n 30

      - name: Use CI O5Dev reference paths
        run: |
          cat > Directory.Build.props <<'EOF'
          <Project>
              <PropertyGroup>
                  <GamePath>/tmp/o5dev-refs/mono</GamePath>
                  <GameData>O5Dev_Data</GameData>
                  <Il2CppPath>/tmp/o5dev-refs/il2cpp</Il2CppPath>
                  <Il2CppData>/tmp/o5dev-refs/il2cpp/MelonLoader/Il2CppAssemblies</Il2CppData>
              </PropertyGroup>
          </Project>
          EOF

      - name: Build Mono (Release_ML)
        # Global properties so sibling O5Kit resolves the same O5Dev ref tree.
        run: >
          dotnet build Overlayer/Overlayer.csproj -c Release_ML --nologo -v minimal
          -p:GamePath=/tmp/o5dev-refs/mono
          -p:GameData=O5Dev_Data
          -p:Il2CppPath=/tmp/o5dev-refs/il2cpp
          -p:Il2CppData=/tmp/o5dev-refs/il2cpp/MelonLoader/Il2CppAssemblies

      - name: Build IL2CPP (Release_ML_IL2CPP)
        run: >
          dotnet build Overlayer/Overlayer.csproj -c Release_ML_IL2CPP --nologo -v minimal
          -p:GamePath=/tmp/o5dev-refs/mono
          -p:GameData=O5Dev_Data
          -p:Il2CppPath=/tmp/o5dev-refs/il2cpp
          -p:Il2CppData=/tmp/o5dev-refs/il2cpp/MelonLoader/Il2CppAssemblies

      - name: Package zips (Mono + IL2CPP)
        run: ./tool/make_zips.sh --all

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}
          files: |
            dist/Overlayer_ML_win.zip
            dist/Overlayer_ML_linux.zip
            dist/Overlayer_ML_mac.zip
            dist/Overlayer_ML_IL2CPP_win.zip
            dist/Overlayer_ML_IL2CPP_linux.zip
            dist/Overlayer_ML_IL2CPP_mac.zip
